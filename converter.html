<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Python Tkinter(ish) to vanilla JS css Converter (WIP)</title>
    <style>
        body { font-family: Arial; background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: white; text-align: center; }
        .panels { display: flex; gap: 20px; }
        .panel { flex: 1; background: white; border-radius: 10px; overflow: hidden; }
        .panel-header { background: #667eea; color: white; padding: 15px; font-weight: bold; }
        textarea { width: 100%; height: 400px; border: none; padding: 15px; font-family: monospace; background: #1e1e1e; color: #ddd; }
        .buttons { text-align: center; margin: 20px 0; }
        button { padding: 12px 25px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; }
        .btn-convert { background: #f5576c; color: white; }
        .btn-download { background: #4facfe; color: white; }
        .btn-sample { background: white; color: #1e3c72; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Python Tkinter(ish) to vanilla JS css Converter (WIP)</h1>
        <div class="panels">
            <div class="panel">
                <div class="panel-header">Python Input</div>
                <textarea id="pythonCode"></textarea>
            </div>
            <div class="panel">
                <div class="panel-header">HTML/JS Output</div>
                <textarea id="jsOutput" readonly></textarea>
            </div>
        </div>
        <div class="buttons">
            <button class="btn-convert" onclick="convert()">Convert</button>
            <button class="btn-download" onclick="download()">Download</button>
            <button class="btn-sample" onclick="loadSample()">Load Basic</button>
            <button class="btn-sample" onclick="loadSample2()">Load Full</button>
        </div>
    </div>

    <script>
        function convert() {
            var code = document.getElementById('pythonCode').value;
            if (!code.trim()) { alert('Enter code'); return; }
            var result = processCode(code);
            document.getElementById('jsOutput').value = result;
        }
        
        function download() {
            var code = document.getElementById('jsOutput').value;
            if (!code.trim()) { alert('Convert first'); return; }
            var a = document.createElement('a');
            a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(code);
            a.download = 'app.html';
            a.click();
        }
        
        function loadSample() {
            document.getElementById('pythonCode').value = 
'import tkinter as tk\n\
\n\
counter = 0\n\
\n\
def increment():\n\
    global counter\n\
    counter = counter + 1\n\
    label.config(text="Count: " + str(counter))\n\
    if counter < 10:\n\
        root.after(500, increment)\n\
\n\
def on_reset():\n\
    global counter\n\
    counter = 0\n\
    label.config(text="Count: 0")\n\
\n\
root = tk.Tk()\n\
root.title("Counter App")\n\
\n\
label = tk.Label(root, text="Count: 0", bg="#eee")\n\
label.pack()\n\
\n\
btn1 = tk.Button(root, text="Start", command=increment, bg="#4CAF50", fg="white")\n\
btn1.pack(side=tk.LEFT, padx=5)\n\
\n\
btn2 = tk.Button(root, text="Reset", command=on_reset, bg="#f44336", fg="white")\n\
btn2.pack(side=tk.LEFT, padx=5)\n\
\n\
root.mainloop()';
            convert();
        }
        
        function loadSample2() {
            var code = 'import tkinter as tk\n\ncounter = 0\nname = "Guest"\n\ndef increment():\n    global counter\n    counter = counter + 1\n    label.config(text="Count: " + str(counter))\n    if counter < 10:\n        root.after(500, increment)\n\ndef decrement():\n    global counter\n    counter = counter - 1\n    label.config(text="Count: " + str(counter))\n\ndef reset():\n    global counter\n    counter = 0\n    label.config(text="Count: 0")\n\ndef show_name():\n    global name\n    name = entry.get()\n    result_label.config(text="Hello, " + name + "!")\n\ndef toggle_feature():\n    if var.get() == "on":\n        status_label.config(text="Feature: ON")\n    else:\n        status_label.config(text="Feature: OFF")\n\ndef start_timer():\n    timer_label.config(text="Timer started!")\n    root.after(2000, timer_done)\n\ndef timer_done():\n    timer_label.config(text="Timer done!")\n\nroot = tk.Tk()\nroot.title("Full App")\n\nlabel = tk.Label(root, text="Count: 0", bg="#eee")\nlabel.pack(pady=10)\n\nbtn_frame = tk.Frame(root)\nbtn_frame.pack(pady=10)\n\ninc_btn = tk.Button(btn_frame, text="+1", command=increment, bg="#4CAF50", fg="white")\ninc_btn.pack(side=tk.LEFT, padx=5)\n\ndec_btn = tk.Button(btn_frame, text="-1", command=decrement, bg="#f44336", fg="white")\ndec_btn.pack(side=tk.LEFT, padx=5)\n\nreset_btn = tk.Button(btn_frame, text="Reset", command=reset, bg="#FF9800", fg="white")\nreset_btn.pack(side=tk.LEFT, padx=5)\n\nentry_frame = tk.Frame(root)\nentry_frame.pack(pady=10)\n\nentry_label = tk.Label(entry_frame, text="Enter name:")\nentry_label.pack(side=tk.LEFT)\n\nentry = tk.Entry(entry_frame, width=15)\nentry.pack(side=tk.LEFT, padx=5)\n\nsubmit_btn = tk.Button(entry_frame, text="Submit", command=show_name)\nsubmit_btn.pack(side=tk.LEFT)\n\nresult_label = tk.Label(root, text="Hello, Guest!")\nresult_label.pack(pady=10)\n\nvar = tk.StringVar(value="off")\ncheck = tk.Checkbutton(root, text="Enable Feature", variable=var, onvalue="on", offvalue="off", command=toggle_feature)\ncheck.pack(pady=5)\n\nstatus_label = tk.Label(root, text="Feature: OFF")\nstatus_label.pack()\n\ntimer_btn = tk.Button(root, text="Start Timer (2s)", command=start_timer, bg="#2196F3", fg="white")\ntimer_btn.pack(pady=10)\n\ntimer_label = tk.Label(root, text="")\ntimer_label.pack()\n\ninfo_frame = tk.Frame(root, bg="#ddd", bd=2, relief=tk.RIDGE)\ninfo_frame.pack(pady=10, padx=20, fill=tk.BOTH)\n\ninfo_label = tk.Label(info_frame, text="This is a Frame with info", bg="#ddd")\ninfo_label.pack(pady=10)\n\nroot.mainloop()';
            document.getElementById('pythonCode').value = code;
            convert();
        }
        
        function processCode(pythonCode) {
            var lines = pythonCode.split('\n');
            var widgets = [];
            var functions = [];
            var globalVars = [];
            var timerCalls = [];
            var rootTitle = 'App';
            
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                var trimmed = line.trim();
                
                if (trimmed.startsWith('import ') || trimmed.startsWith('from ') || trimmed === 'root.mainloop()') continue;
                
                var titleMatch = trimmed.match(/root\.title\(["'](.+?)["']\)/);
                if (titleMatch) { rootTitle = titleMatch[1]; continue; }
                
                var globalMatch = trimmed.match(/^(\w+)\s*=\s*(\d+)$/);
                if (globalMatch && !trimmed.includes('tk.') && !trimmed.includes('root')) {
                    globalVars.push({ name: globalMatch[1], value: globalMatch[2] });
                    continue;
                }
                
                var strVarMatch = trimmed.match(/(\w+)\s*=\s*tk\.StringVar\s*\((.*)\)/);
                if (strVarMatch) { continue; }
                
                var funcMatch = line.match(/^(\s*)def\s+(\w+)\s*\(\s*\):/);
                if (funcMatch && funcMatch[2] !== '__init__') {
                    var funcIndent = funcMatch[1].length;
                    var funcName = funcMatch[2];
                    var funcBody = [];
                    var j = i + 1;
                    while (j < lines.length) {
                        var bodyLine = lines[j];
                        if (bodyLine.trim() === '') { j++; continue; }
                        var bodyIndent = bodyLine.match(/^(\s*)/)[1].length;
                        if (bodyIndent <= funcIndent) break;
                        funcBody.push(bodyLine.trim());
                        j++;
                    }
                    functions.push({ name: funcName, body: funcBody });
                    i = j - 1;
                    continue;
                }
                
                var afterMatch = trimmed.match(/(\w+)\.after\((\d+),\s*(\w+)\)/);
                if (afterMatch) {
                    timerCalls.push({ ms: parseInt(afterMatch[2]), func: afterMatch[3] });
                    continue;
                }
                
                var widgetMatch = trimmed.match(/(\w+)\s*=\s*tk\.(Button|Label|Entry|Frame|Checkbutton)\s*\((.+)\)/);
                if (widgetMatch) {
                    var opts = parseOptions(widgetMatch[3]);
                    widgets.push({ name: widgetMatch[1], type: widgetMatch[2], text: opts.text, command: opts.command, bg: opts.bg, fg: opts.fg, parent: opts.parent, variable: opts.variable, onvalue: opts.onvalue, offvalue: opts.offvalue });
                }
                
                var packMatch = trimmed.match(/(\w+)\.pack\((.*)\)/);
                if (packMatch) {
                    var wName = packMatch[1];
                    var packOpts = parsePackOptions(packMatch[2]);
                    var wIdx = widgets.findIndex(function(w) { return w.name === wName; });
                    if (wIdx >= 0) {
                        widgets[wIdx].pack = packOpts;
                    }
                }
            }
            
            return generateOutput(widgets, functions, globalVars, timerCalls, rootTitle);
        }
        
        function parseOptions(args) {
            var opts = {};
            var textMatch = args.match(/text\s*=\s*["']([^"']*)["']/);
            if (textMatch) opts.text = textMatch[1];
            var cmdMatch = args.match(/command\s*=\s*(\w+)/);
            if (cmdMatch) opts.command = cmdMatch[1];
            var bgMatch = args.match(/bg\s*=\s*["'](#[0-9a-fA-F]{6})["']/);
            if (bgMatch) opts.bg = bgMatch[1];
            var fgMatch = args.match(/fg\s*=\s*["'](#[0-9a-fA-F]{6})["']/);
            if (fgMatch) opts.fg = fgMatch[1];
            var varMatch = args.match(/variable\s*=\s*(\w+)/);
            if (varMatch) opts.variable = varMatch[1];
            var onvalMatch = args.match(/onvalue\s*=\s*["']?(\w+)["']?/);
            if (onvalMatch) opts.onvalue = onvalMatch[1];
            var offvalMatch = args.match(/offvalue\s*=\s*["']?(\w+)["']?/);
            if (offvalMatch) opts.offvalue = offvalMatch[1];
            var parentMatch = args.match(/([^,]+),/);
            if (parentMatch) {
                var firstArg = parentMatch[1].trim();
                if (firstArg !== 'root' && !firstArg.startsWith('tk.')) {
                    opts.parent = firstArg;
                }
            }
            return opts;
        }
        
        function parsePackOptions(args) {
            var opts = {};
            var sideMatch = args.match(/side\s*=\s*tk\.(\w+)/);
            if (sideMatch) opts.side = sideMatch[1];
            var padxMatch = args.match(/padx\s*=\s*(\d+)/);
            if (padxMatch) opts.padx = parseInt(padxMatch[1]);
            var padyMatch = args.match(/pady\s*=\s*(\d+)/);
            if (padyMatch) opts.pady = parseInt(padyMatch[1]);
            return opts;
        }
        
        function generateOutput(widgets, functions, globalVars, timerCalls, title) {
            var out = [];
            
            out.push('<!DOCTYPE html>');
            out.push('<html><head><meta charset="UTF-8"><title>' + title + '</title>');
            out.push('<style>');
            out.push('body{font-family:Arial;background:#f0f0f0;padding:20px}');
            out.push('#app{display:flex;flex-direction:column;align-items:center;gap:10px}');
            out.push('.frame-container{display:flex;flex-direction:row;align-items:center;gap:5px;margin:5px 0;padding:10px}');
            out.push('button{padding:10px 20px;cursor:pointer;border:1px solid #ccc;border-radius:4px;margin:0 5px}');
            out.push('span{display:inline-block;margin:5px 10px}');
            out.push('input{padding:8px;width:150px;border:1px solid #ccc;border-radius:4px;margin:5px 0}');
            out.push('label{cursor:pointer;margin:5px 10px;display:inline-flex;align-items:center;gap:5px}');
            
            widgets.forEach(function(w, idx) {
                if (w.bg) out.push('#w' + idx + '{background:' + w.bg + '}');
                if (w.fg) out.push('#w' + idx + '{color:' + w.fg + '}');
            });
            
            out.push('</style></head><body>');
            out.push('<div id="app">');
            
            var frameIndices = {};
            widgets.forEach(function(w, idx) {
                if (w.type === 'Frame') {
                    frameIndices[w.name] = idx;
                }
            });
            
            widgets.forEach(function(w, idx) {
                if (w.parent && frameIndices[w.parent] !== undefined) {
                    var frame = widgets[frameIndices[w.parent]];
                    if (!frame.children) frame.children = [];
                    frame.children.push(idx);
                }
            });
            
            function renderWidget(idx) {
                var w = widgets[idx];
                
                if (w.children && w.children.length > 0) {
                    var frameStyle = '';
                    if (w.bg) frameStyle += 'background:' + w.bg + ';';
                    var fs = frameStyle ? ' style="' + frameStyle + '"' : '';
                    out.push('<div id="w' + idx + '" class="frame-container"' + fs + '>');
                    w.children.forEach(function(childIdx) {
                        renderWidget(childIdx);
                    });
                    out.push('</div>');
                    return;
                }
                
                if (w.type === 'Checkbutton') {
                    out.push('<label id="w' + idx + '">');
                    out.push('<input type="checkbox" id="cb' + idx + '" ' + (w.onvalue === 'on' ? 'checked' : '') + '> ' + (w.text || '') + '</label>');
                    return;
                }
                
                if (w.type === 'Entry') {
                    out.push('<input type="text" id="w' + idx + '">');
                    return;
                }
                
                var tag = w.type === 'Button' ? 'button' : w.type === 'Label' ? 'span' : 'div';
                var text = w.text || '';
                out.push('<' + tag + ' id="w' + idx + '">' + text + '</' + tag + '>');
            }
            
            widgets.forEach(function(w, idx) {
                if (!w.parent || w.parent === 'root') {
                    renderWidget(idx);
                }
            });
            
            out.push('</div>');
            out.push('<script>');
            
            var addedVars = {};
            if (globalVars.length > 0) {
                globalVars.forEach(function(v) {
                    if (!addedVars[v.name]) {
                        out.push('var ' + v.name + ' = ' + v.value + ';');
                        addedVars[v.name] = true;
                    }
                });
            }
            if (!addedVars['counter']) {
                out.push('var counter = 0;');
            }
            
            functions.forEach(function(f) {
                out.push('function ' + f.name + '() {');
                var ifDepth = 0;
                var elseDepth = 0;
                
                f.body.forEach(function(line, idx) {
                    var trimmed = line.trim();
                    
                    // Determine current indentation level based on if/else depth
                    var indent = '    ';
                    if (ifDepth > 0 || elseDepth > 0) {
                        indent = '        ';
                    }
                    
                    if (trimmed.startsWith('if ')) {
                        ifDepth++;
                        // Convert the if condition and add opening brace
                        var js = convertLine(line, widgets);
                        if (js) out.push(indent + js.replace(/;$/, '') + ' {');
                    } else if (trimmed === 'else:' || trimmed.startsWith('else:')) {
                        // Close the previous if and add else
                        ifDepth--;
                        elseDepth++;
                        out.push('    } else {');
                    } else {
                        var js = convertLine(line, widgets);
                        if (js) out.push(indent + js);
                    }
                });
                
                // Close any remaining blocks
                while (elseDepth > 0) {
                    out.push('    }');
                    elseDepth--;
                }
                while (ifDepth > 0) {
                    out.push('    }');
                    ifDepth--;
                }
                
                // Function closing brace
                out.push('}');
            });
            
            if (timerCalls.length > 0) {
                timerCalls.forEach(function(t, idx) {
                    out.push('var timer' + idx + ' = null;');
                });
            }
            
            out.push('');
            widgets.forEach(function(w, idx) {
                if (w.command) {
                    if (w.type === 'Checkbutton') {
                        out.push('var cb' + idx + ' = document.getElementById("w' + idx + '").querySelector("input[type=checkbox]");');
                        out.push('if (cb' + idx + ') { cb' + idx + '.addEventListener("change", function() { ' + w.command + '(); }); }');
                    } else {
                        out.push('var el' + idx + ' = document.getElementById("w' + idx + '");');
                        out.push('if (el' + idx + ') { el' + idx + '.onclick = function() { ' + w.command + '(); }; }');
                    }
                }
            });
            
            out.push('');
            out.push('console.log("App loaded");');
            out.push('<\/script></body></html>');
            
            return out.join('\n');
        }
        
        // Track if/else state across lines
        var ifDepth = 0;
        var expectElse = false;
        
        function convertLine(line, widgets) {
            if (!line || line.trim() === '') return null;
            
            var result = line;
            
            // Handle .get() - entry.get() or var.get()
            if (result.includes('.get()')) {
                var entryWidget = widgets.find(function(w) { return w.type === 'Entry'; });
                var entryIdx = entryWidget ? widgets.indexOf(entryWidget) : -1;
                
                result = result.replace(/(\w+)\.get\(\)/g, function(match, wName) {
                    if (entryWidget && wName === entryWidget.name && entryIdx >= 0) {
                        return 'document.getElementById("w' + entryIdx + '").value';
                    }
                    // For checkbox variable.get(), return the checked state
                    return 'document.querySelector("input[type=checkbox]").checked';
                });
            }
            
            // Clean up comparison to "on" for checkbox - make it just the boolean
            if (result.includes('== "on"') || result.includes("== 'on'")) {
                result = result.replace(/\s*==\s*["']on["']/, '');
            }
            
            if (result.startsWith('global ')) return null;
            
            // Handle else: - will be processed in function loop
            // Don't convert else here to avoid double handling
            
            if (result.endsWith(':')) result = result.slice(0, -1);
            
            var assignMatch = result.match(/^(\w+)\s*=\s*(.+)$/);
            if (assignMatch && !result.includes('.') && !result.includes('root') && !result.includes('if ')) {
                var varName = assignMatch[1];
                var rhs = assignMatch[2];
                if (varName === 'counter') {
                    return varName + ' = ' + rhs.replace(/str\(/g, 'String(') + ';';
                }
                return 'var ' + varName + ' = ' + rhs.replace(/str\(/g, 'String(') + ';';
            }
            
            var configMatch = result.match(/(\w+)\.config\s*\(\s*text\s*=\s*(.+)\s*\)/);
            if (configMatch) {
                var wName = configMatch[1];
                var txt = configMatch[2];
                txt = txt.replace(/\+\s*str\(/g, '+String(').replace(/str\(/g, 'String(');
                var wIdx = widgets.findIndex(function(w) { return w.name === wName; });
                return 'document.getElementById("w' + wIdx + '").textContent = ' + txt + ';';
            }
            
            var afterMatch = result.match(/(\w+)\.after\((\d+),\s*(\w+)\)/);
            if (afterMatch) {
                var ms = afterMatch[2];
                var func = afterMatch[3];
                return 'setTimeout(' + func + ', ' + ms + ');';
            }
            
            // Handle if condition - add parentheses for JavaScript
            if (result.trim().startsWith('if ')) {
                // Convert Python comparison to JavaScript
                result = result.replace(/if\s+(.+)/, 'if ($1)');
            }
            
            // Track if we're at a deeper indentation - this might signal end of if block
            var trimmed = result.trim();
            if (trimmed && !trimmed.startsWith('if ') && !trimmed.startsWith('else')) {
                // Check if this is a new statement at lower indent (end of if block)
                // This is a heuristic - assumes 4 spaces per indent level
            }
            
            result = result.replace(/str\(/g, 'String(');
            
            return result;
        }
    </script>
</body>
</html>
