<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tkinter → HTML/JS converter</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--pane:#fff;--bd:#d6d3c8;--ac:#2a5db0;--mu:#6b6a63;--wn:#9a5b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181b;--fg:#e8e6df;--pane:#202226;--bd:#33363c;--ac:#7aa7f0;--mu:#97958c;--wn:#e8b35a}}
:root[data-theme=dark]{--bg:#17181b;--fg:#e8e6df;--pane:#202226;--bd:#33363c;--ac:#7aa7f0;--mu:#97958c;--wn:#e8b35a}
html,body{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding:12px;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}h1{font-size:18px;margin:0}header span{color:var(--mu);font-size:12.5px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-auto-rows:minmax(340px,1fr)}body{height:auto}}
.col{display:flex;flex-direction:column;min-height:0;background:var(--pane);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.bar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);font-weight:600;font-size:13px}.bar .sp{flex:1}
button{font:inherit;font-size:12.5px;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:3px 10px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
textarea,pre{flex:1;min-height:0;margin:0;border:0;outline:0;padding:10px;background:var(--pane);color:var(--fg);font:12.5px/1.5 ui-monospace,Consolas,monospace;tab-size:4;resize:none;overflow:auto;white-space:pre}
iframe{flex:1;border:0;background:#fff;min-height:0;width:100%}
#warn{font-size:12px;color:var(--wn);padding:0 8px 6px;min-height:0}#warn:empty{display:none}
</style></head><body>
<header><h1>Tkinter → HTML / CSS / JS</h1><span>Paste Python 3 tkinter code. Output is one self-contained HTML file (runtime included).</span></header>
<main>
<section class="col"><div class="bar">Python (tkinter)<span class="sp"></span><button id="ld">Load sample</button></div><textarea id="src" spellcheck="false"></textarea></section>
<section class="col"><div class="bar"><button id="tp" class="on">Preview</button><button id="tc">HTML output</button><span class="sp"></span><button id="cp">Copy HTML</button></div><div id="warn"></div><iframe id="prev" sandbox="allow-scripts allow-modals"></iframe><pre id="code" style="display:none"></pre></section>
</main>

<script type="text/plain" id="sample">
"""Task board demo: menus, tabs, todos, animated canvas, auto-refreshing photo API."""
import tkinter as tk
from tkinter import ttk, messagebox
from io import BytesIO
from PIL import Image, ImageTk
import requests
import random
import time

TODO_SEED = ["Buy milk", "Write converter", "Ship it"]
COLORS = ["#e76f51", "#2a9d8f", "#e9c46a", "#264653", "#f4a261"]


class App(tk.Frame):
    def __init__(self, master=None):
        super().__init__(master)
        self.dark = tk.BooleanVar(value=False)
        self.priority = tk.StringVar(value="Medium")
        self.speed = tk.IntVar(value=3)
        self.shape = tk.StringVar(value="oval")
        self.status = tk.StringVar(value="Ready")
        self.balls = []
        self.auto = tk.BooleanVar(value=True)
        self.interval = tk.IntVar(value=5)
        self.job = None
        self.page = 0
        self.pack(fill=tk.BOTH, expand=True)
        self.make_menu()
        self.make_tabs()
        self.make_statusbar()
        for item in TODO_SEED:
            self.add_todo(item)
        self.tick()
        self.animate()
        self.fetch_photo()

    # ---------- menu / layout ----------
    def make_menu(self):
        bar = tk.Menu(self.master)
        file_menu = tk.Menu(bar, tearoff=0)
        file_menu.add_command(label="Clear todos", command=self.clear_todos)
        file_menu.add_separator()
        file_menu.add_command(label="Quit", command=lambda: self.master.destroy())
        bar.add_cascade(label="File", menu=file_menu)
        help_menu = tk.Menu(bar, tearoff=0)
        help_menu.add_command(label="About", command=self.about)
        bar.add_cascade(label="Help", menu=help_menu)
        self.master.config(menu=bar)

    def make_tabs(self):
        self.nb = ttk.Notebook(self)
        self.nb.pack(fill=tk.BOTH, expand=True, padx=6, pady=6)
        self.tab_todo = tk.Frame(self.nb)
        self.tab_draw = tk.Frame(self.nb)
        self.tab_data = tk.Frame(self.nb)
        self.nb.add(self.tab_todo, text="Todos")
        self.nb.add(self.tab_draw, text="Canvas")
        self.nb.add(self.tab_data, text="Photos (API)")
        self.build_todo()
        self.build_draw()
        self.build_data()

    def make_statusbar(self):
        bar = tk.Frame(self, relief=tk.SUNKEN, bd=1)
        bar.pack(fill=tk.X, side=tk.BOTTOM)
        tk.Label(bar, textvariable=self.status, anchor="w").pack(side=tk.LEFT, padx=6)
        self.clock = tk.Label(bar, text="", font=("Courier", 10))
        self.clock.pack(side=tk.RIGHT, padx=6)

    # ---------- todos tab ----------
    def build_todo(self):
        top = tk.Frame(self.tab_todo)
        top.pack(fill=tk.X, padx=6, pady=6)
        self.entry = tk.Entry(top, width=24)
        self.entry.pack(side=tk.LEFT, padx=(0, 6))
        self.entry.bind("<Return>", self.on_enter)
        combo = ttk.Combobox(top, textvariable=self.priority, values=["Low", "Medium", "High"], width=8)
        combo.pack(side=tk.LEFT, padx=(0, 6))
        tk.Button(top, text="Add", command=self.on_add).pack(side=tk.LEFT)

        self.listbox = tk.Listbox(self.tab_todo, height=8, selectmode=tk.SINGLE)
        self.listbox.pack(fill=tk.BOTH, expand=True, padx=6)
        self.listbox.bind("<Double-Button-1>", self.on_done)

        row = tk.Frame(self.tab_todo)
        row.pack(fill=tk.X, padx=6, pady=6)
        tk.Button(row, text="Remove selected", command=self.on_remove).pack(side=tk.LEFT)
        tk.Checkbutton(row, text="Dark canvas", variable=self.dark, command=self.on_theme).pack(side=tk.LEFT, padx=10)
        self.count_label = tk.Label(row, text="0 items", fg="#555")
        self.count_label.pack(side=tk.RIGHT)

    def on_enter(self, event):
        self.on_add()

    def on_add(self):
        text = self.entry.get().strip()
        if not text:
            messagebox.showwarning("Empty", "Type something first")
            return
        self.add_todo(text + " [" + self.priority.get() + "]")
        self.entry.delete(0, tk.END)

    def add_todo(self, text):
        self.listbox.insert(tk.END, text)
        self.refresh_count()

    def refresh_count(self):
        n = self.listbox.size()
        self.count_label.config(text=f"{n} items")
        self.status.set(f"{n} todos")

    def on_remove(self):
        sel = self.listbox.curselection()
        if len(sel) == 0:
            return
        self.listbox.delete(sel[0])
        self.refresh_count()

    def on_done(self, event):
        sel = self.listbox.curselection()
        if len(sel) == 0:
            return
        idx = sel[0]
        text = self.listbox.get(idx)
        if not text.startswith("✓ "):
            self.listbox.delete(idx)
            self.listbox.insert(idx, "✓ " + text)

    def clear_todos(self):
        self.listbox.delete(0, tk.END)
        self.refresh_count()

    def on_theme(self):
        bg = "#1b1b2f" if self.dark.get() else "#f5f5f5"
        self.canvas.config(bg=bg)
        self.status.set("Canvas theme: " + ("dark" if self.dark.get() else "light"))

    # ---------- canvas tab ----------
    def build_draw(self):
        self.canvas = tk.Canvas(self.tab_draw, width=420, height=220, bg="#f5f5f5", highlightthickness=0)
        self.canvas.pack(padx=6, pady=6)
        self.canvas.bind("<Button-1>", self.on_click)
        ctl = tk.Frame(self.tab_draw)
        ctl.pack(fill=tk.X, padx=6)
        tk.Label(ctl, text="Speed").pack(side=tk.LEFT)
        tk.Scale(ctl, from_=1, to=10, orient=tk.HORIZONTAL, variable=self.speed, length=120).pack(side=tk.LEFT, padx=6)
        tk.Label(ctl, text="Size").pack(side=tk.LEFT)
        self.size = tk.Spinbox(ctl, from_=6, to=40, width=4, command=self.restyle)
        self.size.delete(0, tk.END)
        self.size.insert(0, "16")
        self.size.bind("<KeyRelease>", lambda e: self.restyle())
        self.size.pack(side=tk.LEFT, padx=6)
        tk.Radiobutton(ctl, text="Circle", variable=self.shape, value="oval", command=self.restyle).pack(side=tk.LEFT)
        tk.Radiobutton(ctl, text="Square", variable=self.shape, value="rect", command=self.restyle).pack(side=tk.LEFT)
        tk.Label(self.tab_draw, text="Click the canvas to spawn shapes", fg="#777").pack(pady=4)
        for i in range(3):
            self.spawn(70 + i * 140, 60)

    def on_click(self, event):
        self.spawn(event.x, event.y)

    def draw_shape(self, x, y, r, color):
        if self.shape.get() == "oval":
            return self.canvas.create_oval(x - r, y - r, x + r, y + r, fill=color, outline="")
        return self.canvas.create_rectangle(x - r, y - r, x + r, y + r, fill=color, outline="")

    def spawn(self, x, y):
        r = int(self.size.get() or 16)
        color = random.choice(COLORS)
        item = self.draw_shape(x, y, r, color)
        self.balls.append({"id": item, "color": color, "dx": random.randint(-3, 3) or 2, "dy": random.randint(-3, 3) or -2})
        self.status.set("Shapes: " + str(len(self.balls)))

    def restyle(self):
        # apply the current shape + size to every existing shape
        r = int(self.size.get() or 16)
        w = int(self.canvas.cget("width"))
        h = int(self.canvas.cget("height"))
        for ball in self.balls:
            x1, y1, x2, y2 = self.canvas.coords(ball["id"])
            cx = max(r, min(w - r, (x1 + x2) / 2))
            cy = max(r, min(h - r, (y1 + y2) / 2))
            self.canvas.delete(ball["id"])
            ball["id"] = self.draw_shape(cx, cy, r, ball["color"])
        self.status.set("Shape: " + self.shape.get() + ", size " + str(r))

    def animate(self):
        w = int(self.canvas.cget("width"))
        h = int(self.canvas.cget("height"))
        k = self.speed.get()
        for ball in self.balls:
            self.canvas.move(ball["id"], ball["dx"] * k / 3, ball["dy"] * k / 3)
            x1, y1, x2, y2 = self.canvas.coords(ball["id"])
            if x1 <= 0 or x2 >= w:
                ball["dx"] = -ball["dx"]
            if y1 <= 0 or y2 >= h:
                ball["dy"] = -ball["dy"]
        self.after(30, self.animate)

    # ---------- photo tab ----------
    def build_data(self):
        self.photo_label = tk.Label(self.tab_data, text="Loading photo...", bg="#ddd", padx=100, pady=80)
        self.photo_label.pack(pady=(6, 0))
        self.author = tk.Label(self.tab_data, text="", fg="#555")
        self.author.pack()
        ctl = tk.Frame(self.tab_data)
        ctl.pack(fill=tk.X, padx=6, pady=4)
        tk.Checkbutton(ctl, text="Auto refresh", variable=self.auto, command=self.schedule_photo).pack(side=tk.LEFT)
        tk.Label(ctl, text="every (s)").pack(side=tk.LEFT, padx=(8, 0))
        tk.Scale(ctl, from_=3, to=15, orient=tk.HORIZONTAL, variable=self.interval, length=110, command=self.on_interval).pack(side=tk.LEFT)
        tk.Button(ctl, text="Next photo", command=self.fetch_photo).pack(side=tk.LEFT, padx=6)
        self.progress = ttk.Progressbar(ctl, length=90, mode="determinate")
        self.progress.pack(side=tk.LEFT)
        self.table = ttk.Treeview(self.tab_data, columns=("id", "author", "size"), show="headings", height=3)
        self.table.heading("id", text="ID")
        self.table.heading("author", text="Author")
        self.table.heading("size", text="Original size")
        self.table.pack(fill=tk.X, padx=6)
        self.log = tk.Text(self.tab_data, height=3, width=52)
        self.log.pack(fill=tk.X, padx=6, pady=6)

    def on_interval(self, value):
        self.schedule_photo()

    def schedule_photo(self):
        if self.job is not None:
            self.after_cancel(self.job)
            self.job = None
        if self.auto.get():
            self.job = self.after(self.interval.get() * 1000, self.fetch_photo)

    def fetch_photo(self):
        self.status.set("Fetching photo...")
        self.progress.config(value=20)
        try:
            self.page += 1
            meta = requests.get("https://picsum.photos/v2/list", params={"page": self.page, "limit": 1}, timeout=8).json()
            info = meta[0]
            self.progress.config(value=55)
            url = "https://picsum.photos/id/" + str(info["id"]) + "/320/200"
            raw = requests.get(url, timeout=10)
            img = Image.open(BytesIO(raw.content)).resize((320, 200))
            self.photo = ImageTk.PhotoImage(img)
            self.photo_label.config(image=self.photo)
            self.author.config(text="Photo by " + info["author"] + " (id " + str(info["id"]) + ")")
            self.table.insert("", tk.END, values=(info["id"], info["author"], str(info["width"]) + "x" + str(info["height"])))
            self.progress.config(value=100)
            self.status.set("Photo loaded")
            self.log_line("Loaded photo " + str(info["id"]))
        except Exception as e:
            self.progress.config(value=0)
            self.status.set("Request failed")
            self.log_line("Error: " + str(e))
        self.schedule_photo()

    def log_line(self, msg):
        self.log.insert(tk.END, time.strftime("%H:%M:%S") + "  " + msg + "\n")
        self.log.see(tk.END)

    # ---------- misc ----------
    def tick(self):
        self.clock.config(text=time.strftime("%Y-%m-%d %H:%M:%S"))
        self.after(1000, self.tick)

    def about(self):
        win = tk.Toplevel(self.master)
        win.title("About")
        win.geometry("260x120+80+80")
        tk.Label(win, text="Tkinter → web demo\nConverted by tk2web", pady=14).pack()
        tk.Button(win, text="Close", command=lambda: win.destroy()).pack()


def main():
    root = tk.Tk()
    root.title("Task Board — tkinter → web")
    root.geometry("560x570")
    App(root)
    root.mainloop()


if __name__ == "__main__":
    main()
</script>

_opt(k,v){if(k=='columns'){this._cols=[].concat(v);this._hd()}else if(k=='height')this.el.style.height=v*20+'px';else super._opt(k,v)}
_hd(){const h=this._t.tHead||this._t.createTHead();h.innerHTML='';const r=h.insertRow();this._cols.forEach(c=>{const th=document.createElement('th');th.textContent=this._ht[c]||c;th.style.cssText='background:#e3e3e3;border:1px solid #bbb;padding:2px 6px;text-align:left;position:sticky;top:0';r.append(th)})}
heading(c,o){this._ht[c]=(o||{}).text||c;this._hd()}column(){}
insert(p,i,o){o=o||{};const id=o.iid||'I'+(++this._n),r=(this._t.tBodies[0]||this._t.createTBody()).insertRow(i=='end'?-1:i);(this._cols.length?o.values||[]:[o.text||'']).forEach(v=>{const c=r.insertCell();c.textContent=v;c.style.cssText='border:1px solid #ddd;padding:2px 6px'});
r.onclick=()=>{this._sel=[id];[...this._t.tBodies[0].rows].forEach(x=>x.style.background=x==r?'#cfe0ff':'');this.el.dispatchEvent(new Event('change'))};this._r[id]={r,o};return id}

create_rectangle(...a){return this._add('r',a)}create_oval(...a){return this._add('o',a)}create_line(...a){return this._add('l',a)}create_text(...a){return this._add('t',a)}create_polygon(...a){return this._add('p',a)}
_m(id){return this.it.filter(i=>id=='all'||i.id==id||[].concat(i.o.tags||[]).includes(id))}

else if(i.t=='o')x.ellipse((k[0]+k[2])/2,(k[1]+k[3])/2,Math.abs(k[2]-k[0])/2,Math.abs(k[3]-k[1])/2,0,0,7);
else if(i.t=='t'){const{fam,sz,st}=fp(o.font||'Arial 12'),a=o.anchor||'center';x.font=`${/italic/.test(st)?'italic ':''}${/bold/.test(st)?'bold ':''}${sz?(sz<0?-sz:sz*1.333):12}px ${fam&&!/^Tk/.test(fam)?'"'+fam+'"':'sans-serif'}`;

else{k.forEach((v,j)=>{if(j%2==0)j?x.lineTo(v,k[j+1]):x.moveTo(v,k[j+1])});if(i.t=='p')x.closePath()}

<script>
const SO='<'+'script>',SC='<'+'/script>',$=id=>document.getElementById(id);
const CLS=['Tk','Toplevel','Frame','LabelFrame','Label','Button','Entry','Text','Canvas','Checkbutton','Radiobutton','Scale','Listbox','Scrollbar','Menu','Spinbox','Combobox','OptionMenu','Progressbar','Separator','Notebook','Treeview','Message','PanedWindow','ScrolledText','Menubutton','Style','PhotoImage','StringVar','IntVar','DoubleVar','BooleanVar'];

function splitTop(s){const r=[];let d=0,c='';for(const ch of s){if('([{'.includes(ch))d++;else if(')]}'.includes(ch))d--;if(ch==','&&!d){r.push(c);c=''}else c+=ch}if(c.trim()||r.length)r.push(c);return r}
function topColon(t){let d=0;for(let i=0;i<t.length;i++){const c=t[i];if('([{'.includes(c))d++;else if(')]}'.includes(c))d--;else if(c==':'&&!d)return i}return -1}
const fixT=s=>{const m=s.match(/^(.+?)\s+if\s+(.+?)\s+else\s+(.+)$/);return m?`(${m[2]}) ? ${m[1]} : ${fixT(m[3])}`:s};

/* ---------- Python -> JS (subset) ---------- */
function convert(src){
  const strs=[],warn=[],methods=new Set(),G=new Set(),uc=[],AS=new Set(),WN=new Set();let curAsync=true;
  src=src.replace(/\r/g,'').replace(/#[^\n]*|([fFrRbBuU]{0,2})("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')/g,(m,p,s)=>{
    if(s===undefined)return '';strs.push({p:p.toLowerCase(),s});return '\u0001'+(strs.length-1)+'\u0001'});
  // join continuation lines, expand "if x: stmt"
  const lines=[];let buf='',depth=0,ind=0;
  for(const l of src.split('\n')){
    if(!buf){if(!l.trim())continue;ind=l.match(/^[ \t]*/)[0].replace(/\t/g,'    ').length}
    buf+=(buf?' ':'')+l.trim();depth+=(l.match(/[(\[{]/g)||[]).length-(l.match(/[)\]}]/g)||[]).length;
    if(depth<=0){const t=buf;buf='';depth=0;const i=/^(if|elif|else|while|for|try|except|finally|with|def|class)\b/.test(t)?topColon(t):-1;
      if(i>=0&&i<t.length-1){lines.push({ind,t:t.slice(0,i+1)},{ind:ind+4,t:t.slice(i+1).trim()})}else lines.push({ind,t})}
  }
  for(const {t} of lines){let m;if(m=t.match(/^class\s+(\w+)/))uc.push(m[1]);if(m=t.match(/^def\s+(\w+)\s*\(\s*self\b/))methods.add(m[1]);
    for(const [re,msg] of [[/[\[({][^\])}]*\sfor\s.+\sin\s/,'comprehensions'],[/\.format\(/,'str.format'],[/\.join\(/,'str.join()'],[/\w\[[^\]]*:[^\]]*\]/,'slicing'],[/\u0001\s*%\s*[\w(]/,'% formatting'],[/^with\b/,'with-blocks'],[/\byield\b/,'generators']])
      if(re.test(t)&&!warn.includes(msg))warn.push(msg)}
  if(warn.length)warn[0]='Not translated (review by hand): '+warn[0];
  // pre-pass: any def that does HTTP (or calls such a def) becomes async
  const NET=/(?<![\w.])(?:(?:requests|httpx)\.(?:get|post|put|delete|patch|head|request)|urllib\.request\.urlopen|urlopen)\s*\(/,NETG=new RegExp(NET.source,'g'),ds=[],calls=[];
  for(const {ind,t} of lines){while(ds.length&&ds[ds.length-1].ind>=ind)ds.pop();let m;
    if(m=t.match(/^def\s+(\w+)/)){ds.push({ind,n:m[1]});continue}
    if(m=t.match(/^([\w.]+)\s*=\s*(?:(?:tk|ttk)\.)?(?:Tk|Toplevel|Frame|LabelFrame|Label|Button|Entry|Text|Canvas|Checkbutton|Radiobutton|Scale|Listbox|Spinbox|Combobox|Progressbar|Notebook|Treeview)\s*\(/))WN.add(m[1]);
    const d=ds[ds.length-1];if(d){if(NET.test(t))AS.add(d.n);calls.push([d.n,t])}}
  for(let ch=1;ch;){ch=0;for(const [d,t] of calls)if(d!='__init__'&&!AS.has(d)&&[...AS].some(n=>new RegExp('(?<![\\w.])(?:self\\.)?'+n+'\\s*\\(').test(t))){AS.add(d);ch=1}}
  AS.delete('__init__');
  const NEWRE=new RegExp('(?<![\\w.])(?<!new )(?:'+CLS.concat(uc).join('|')+')(?=\\s*\\()','g');

  function lit({p,s}){const t=s.startsWith('"""')||s.startsWith("'''"),b=s.slice(t?3:1,t?-3:-1);
    if(p.includes('f'))return '`'+b.replace(/`/g,'\\`').replace(/\{\{|\}\}|\{([^{}]+)\}/g,(m,e)=>m=='{{'?'{':m=='}}'?'}':'${'+fx(e)+'}')+'`';
    if(t)return '`'+b.replace(/`/g,'\\`')+'`';return p.includes('r')?JSON.stringify(b):s}
  function fx(e){const m=e.match(/^(.*?)(?:!\w)?(?::([^:]*))?$/),f=m[2];let x=ex(m[1].trim()),q;
    if(f&&(q=f.match(/^\.(\d+)f$/)))x=`(${x}).toFixed(${q[1]})`;else if(f&&(q=f.match(/^0?(\d+)d$/)))x=`String(${x}).padStart(${q[1]},"0")`;return x}

  function ex(s){
    const lam=/\blambda\b/.test(s);
    s=s.replace(/\b(tk|tkinter|ttk|scrolledtext)\./g,'')
      .replace(/\blambda\b\s*([^:]*):\s*/g,(m,a)=>'('+a.trim()+') => ')
      .replace(/(?<![=!<>])==(?!=)/g,'===').replace(/!=(?!=)/g,'!==')
      .replace(/\bis\s+not\b/g,'!==').replace(/\bis\b/g,'===')
      .replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null')
      .replace(/\band\b/g,'&&').replace(/\bor\b/g,'||')
      .replace(/([\w.\u0001]+)\s+not\s+in\s+([\w.\u0001]+)/g,'!inn($1, $2)')
      .replace(/([\w.\u0001]+)\s+in\s+([\w.\u0001]+)/g,'inn($1, $2)')
      .replace(/\bnot\b/g,'!')
      .replace(/\bself\.(\w+)(?!\w|\s*\()/g,(m,n)=>methods.has(n)?'this.'+n+'.bind(this)':m)
      .replace(/\bself\b/g,'this')
      .replace(/\bmath\.pi\b/g,'Math.PI').replace(/\bmath\./g,'Math.').replace(/\bdatetime\.datetime\b/g,'datetime')
      .replace(/\bprint\s*\(/g,'console.log(').replace(/\bstr\s*\(/g,'String(')
      .replace(/\.append\(/g,'.push(').replace(/\.upper\(\)/g,'.toUpperCase()').replace(/\.lower\(\)/g,'.toLowerCase()').replace(/\.strip\(\)/g,'.trim()')
      .replace(/\.startswith\(/g,'.startsWith(').replace(/\.endswith\(/g,'.endsWith(').replace(/\.split\(\)/g,'.trim().split(/\\s+/)')
      .replace(/([\w.]+)\.items\(\)/g,'Object.entries($1)').replace(/([\w.]+)\.keys\(\)/g,'Object.keys($1)').replace(/([\w.]+)\.values\(\)/g,'Object.values($1)')
      .replace(/([\w.]+)\s*\/\/\s*([\w.]+)/g,'Math.floor($1 / $2)')
      .replace(NEWRE,m=>'new '+m).replace(/([(,]\s*)\*(?!\*)(?=\w)/g,'$1...').replace(/\.(?:decode|encode)\([^()]*\)/g,'');
    if(curAsync&&!lam){s=s.replace(NETG,m=>'await '+m);for(const n of AS)s=s.replace(new RegExp('(?<![\\w.])((?:this\\.)?'+n+')\\s*\\(','g'),'await $1(')}
    const P=[];let prev;
    do{prev=s;s=s.replace(/\(([^()]*)\)/g,(m,inner,off,all)=>{
      const ps=splitTop(inner),pos=[],kw=[];
      for(let a of ps){a=a.trim();if(!a)continue;const k=a.match(/^([A-Za-z_]\w*)\s*=(?![=>])\s*([\s\S]+)$/);k?kw.push(k[1]+': '+fixT(k[2])):pos.push(fixT(a))}
      const bef=all.slice(0,off),call=(/[\w\u0001\u0002\]]\s*$/.test(bef)&&!/(^|[^\w.])(return|in|if|while|elif|else|and|or|inn|yield)\s*$/.test(bef))||/^\s*=>/.test(all.slice(off+m.length));
      const o=pos.concat(kw.length?['{'+kw.join(', ')+'}']:[]).join(', ');
      return '\u0002'+(P.push(!call&&(ps.length>1||!o)?'['+o+']':'('+o+')')-1)+'\u0002'})}while(s!==prev);
    s=fixT(s);while(/\u0002\d+\u0002/.test(s))s=s.replace(/\u0002(\d+)\u0002/g,(_,i)=>P[i]);
    return s.replace(/\u0001(\d+)\u0001/g,(_,i)=>lit(strs[i]));
  }
  function head(t,inCls){t=t.slice(0,-1).trim();let m;
    if(m=t.match(/^class\s+(\w+)\s*(?:\((.*)\))?$/)){const b=(m[2]||'').replace(/\b(tk|tkinter|ttk)\./g,'').trim();return['class','class '+m[1]+(b&&b!='object'?' extends '+b:'')+' {']}
    if(m=t.match(/^def\s+(\w+)\s*\((.*?)\)\s*(?:->.*)?$/)){
      const ps=splitTop(m[2]).map(p=>p.trim()).filter(p=>p&&p!='self').map(p=>{const q=p.match(/^(\*{0,2})(\w+)\s*(?::[^=]*)?(?:=\s*([\s\S]*))?$/);return(q[1]=='*'?'...':'')+q[2]+(q[3]?' = '+ex(q[3]):'')}).join(', ');
      const as=AS.has(m[1])?'async ':'';
      return inCls?['meth',as+(m[1]=='__init__'?'constructor':m[1])+'('+ps+') {',as]:['fn','var '+m[1]+' = '+as+'('+ps+') => {',as]}
    if(m=t.match(/^if\s+(.*)$/))return/__name__/.test(m[1])?['blk','{']:['if','if ('+ex(m[1])+') {'];
    if(m=t.match(/^elif\s+(.*)$/))return['if','else if ('+ex(m[1])+') {'];
    if(t=='else')return['if','else {'];
    if(m=t.match(/^while\s+(.*)$/))return['while','while ('+ex(m[1])+') {'];
    if(t=='try')return['try','try {'];
    if(m=t.match(/^except\b(?:.*\bas\s+(\w+))?$/))return['try','catch ('+(m[1]||'_e')+') {'];
    if(t=='finally')return['try','finally {'];
    if(m=t.match(/^for\s+(\w+)\s+in\s+range\s*\((.*)\)$/)){const a=splitTop(m[2]).map(x=>ex(x.trim())),v=m[1],[b,e,st]=a.length==1?['0',a[0],'1']:[a[0],a[1],a[2]||'1'];
      return['for',`for (let ${v} = ${b}; ${v} ${/^-/.test(st)?'>':'<'} ${e}; ${v} ${st=='1'?'++':'+= '+st}) {`]}
    if(m=t.match(/^for\s+(.+?)\s+in\s+(.+)$/)){const v=m[1].replace(/[()]/g,'').trim();return['for','for (let '+(v.includes(',')?'['+v+']':v)+' of iter('+ex(m[2])+')) {']}
    return['blk','{']}
  function stmt(t){let m;
    if(/^(import|from)\s/.test(t)||/^pass$/.test(t))return '';
    if(m=t.match(/^(?:global|nonlocal)\s+(.*)/)){m[1].split(',').forEach(n=>G.add(n.trim()));return ''}
    if(m=t.match(/^(?:super\s*\(.*?\)|[\w.]+)\.__init__\s*\((.*)\)$/))return 'super'+ex('_('+m[1].replace(/^\s*self\s*,?\s*/,'')+')').slice(1)+';';
    if((m=t.match(/^([\w.]+)\[\u0001(\d+)\u0001\]\s*=(?!=)\s*(.+)$/))&&WN.has(m[1])&&/^["']\w+["']$/.test(strs[m[2]].s))return ex(m[1])+'.config({'+strs[m[2]].s.slice(1,-1)+': '+ex(m[3])+'});';
    if(m=t.match(/^return\b\s*(.*)$/)){const r=ex(m[1]);return 'return'+(r?' '+(splitTop(r).length>1?'['+r+']':r):'')+';'}
    if(m=t.match(/^([\w.\[\]\u0001\u0002, ]+?)\s*(\*\*|\/\/|\+|-|\*|\/|%)?=(?!=)\s*(.+)$/)){
      const lhs=m[1].trim(),op=m[2]||'';let r=ex(m[3]);
      if(lhs.includes(',')){const L=lhs.split(',').map(x=>ex(x.trim()));if(splitTop(r).length>1)r='['+r+']';
        return(L.every(x=>/^[A-Za-z_]\w*$/.test(x)&&!G.has(x))?'var ':'')+'['+L.join(', ')+'] = '+r+';'}
      const l=ex(lhs);if(op=='//')return `${l} = Math.floor(${l} / (${r}));`;
      return(/^[A-Za-z_]\w*$/.test(lhs)&&!op&&!G.has(lhs)?'var ':'')+l+' '+op+'= '+r+';'}
    return ex(t)+';'}

  const out=[],st=[],pad=n=>' '.repeat(n);
  for(const {ind,t} of lines){
    if(t[0]=='@'||/^\u0001\d+\u0001$/.test(t))continue;
    const cont=/^(elif|else|except|finally)\b/.test(t);let merged=false;
    while(st.length&&st[st.length-1].ind>=ind){const b=st.pop(),last=!(st.length&&st[st.length-1].ind>=ind);
      if(last&&cont&&b.ind==ind&&(b.type=='if'||b.type=='try'))merged=true;else out.push(pad(b.ind)+b.close)}
    const dd=[...st].reverse().find(b=>b.type=='fn'||b.type=='meth');curAsync=dd?!!dd.as:true;
    if(t.endsWith(':')){const top=st[st.length-1],[type,txt,as]=head(t,top&&top.type=='class');st.push({ind,type,as:!!as,close:type=='fn'?'};':'}'});out.push(pad(ind)+(merged?'} ':'')+txt)}
    else{const s=stmt(t);if(s)out.push(pad(ind)+s)}
  }
  while(st.length){const b=st.pop();out.push(pad(b.ind)+b.close)}
  return{js:out.join('\n'),warn}
}

/* ---------- output document ---------- */
function build(js){return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8">\n<title>Tk app</title>\n<style>\n'+$('css').textContent.trim()+'\n</style></head>\n<body>\n<div id="tk-root"></div>\n'+SO+'\n/* ---- tkinter runtime ---- */\n'+$('rt').textContent.trim()+'\n'+SC+'\n'+SO+'\n/* ---- converted app ---- */\n(async()=>{\n'+js+'\n})();\n'+SC+'\n</body></html>\n'}

/* ---------- UI ---------- */
let code='',timer;
function run(){try{const r=convert($('src').value);code=build(r.js);$('warn').textContent=r.warn.join(' · ')}catch(e){code='<pre>Converter error: '+e.message+'</pre>';$('warn').textContent='Converter error: '+e.message}
  $('code').textContent=code;$('prev').srcdoc=code}
function tab(p){$('prev').style.display=p?'':'none';$('code').style.display=p?'none':'';$('tp').classList.toggle('on',p);$('tc').classList.toggle('on',!p)}
$('src').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,600)});
$('src').addEventListener('keydown',e=>{if(e.key=='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}});
$('ld').onclick=()=>{$('src').value=$('sample').textContent.trim()+'\n';run()};
$('tp').onclick=()=>tab(true);$('tc').onclick=()=>tab(false);
$('cp').onclick=()=>{const done=()=>{$('cp').textContent='Copied';setTimeout(()=>$('cp').textContent='Copy HTML',1200)};
  const fb=()=>{tab(false);const r=document.createRange();r.selectNodeContents($('code'));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');done()}catch(e){}};
  navigator.clipboard?navigator.clipboard.writeText(code).then(done,fb):fb()};
$('ld').onclick();
</script>
